version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: meeting-notes-db
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: meeting_notes
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
