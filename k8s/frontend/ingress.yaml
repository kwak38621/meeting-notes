apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-notes-ingress
  namespace: meeting-notes
spec:
  ingressClassName: nginx
  rules:
    - host: meeting-notes.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
