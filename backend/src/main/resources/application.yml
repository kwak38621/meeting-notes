spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/meeting_notes?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

cors:
  allowed-origin: ${CORS_ORIGIN:http://localhost:3000}
